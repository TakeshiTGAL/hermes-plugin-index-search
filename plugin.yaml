name: index-search
version: 0.1.3
manifest_version: 2
requires_hermes: ">=0.21.6"
description: "Search one index you run and watch one saved query, with index_search, index_health and index_watch. It searches a Meilisearch server you run, so notes or local files can be found only after you index them there; it does not search files on disk itself. Disclosure — Sends MEILI_API_KEY as a Bearer token to your MEILI_HOST. Over plain http that key travels unencrypted, and a master or admin key is sent as given, so use a search-only key. The tools are on for every surface, including gateways: anyone you allow on your Hermes gateway can search with your key and approve a watch. Turn a surface off with hermes tools. On Hermes 0.21.6 and later, while the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. index_watch schedule creates one cron job that runs a model turn every 15 minutes (two or more model requests when it calls the tool) with no daily cap, and it watches only the first 20 hits. The job stays after uninstall until you run hermes cron remove, with -p and the profile name when the profile is not default. Scheduling and unscheduling return one pre_tool_call approve line. Hermes asks. yolo and approvals off skip the prompt. cron, -q, and unattended sessions default to deny. plugins.isolation still refuses the change. Answering \"always\" covers only that same watch plan. The watch still uses Hermes cron and the write guard, so an update can stop it."
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-index-search
provides_tools:
  - index_search
  - index_health
  - index_watch
provides_hooks:
  - pre_tool_call
python_dependencies: []
requires_env:
  - name: MEILI_HOST
    description: "Origin of the search server you run. Scheme, host, and an optional port. This plugin has no default host."
    prompt: "Search server origin"
  - name: MEILI_API_KEY
    description: "Bearer token sent only on search. Use a search-only key. It is not sent on the health check."
    prompt: "Search API key"
    secret: true
    password: true
